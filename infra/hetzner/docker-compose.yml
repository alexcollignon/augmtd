services:
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    environment:
      # int8 is load-bearing: the unset default ran float32 (fp16 unsupported on CPU),
      # which was both ~2x slower AND ballooned to ~6GB RSS on 40-min files — the OOM
      # kills behind the "Server disconnected" transcription retries (Aug 4-5).
      # The MODEL env is only a default — the worker names its model per-request
      # (deepdml/faster-whisper-large-v3-turbo-ct2, benchmarked fastest+most accurate).
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__MODEL: deepdml/faster-whisper-large-v3-turbo-ct2
    ports:
      # Bound to loopback + the docker bridge gateway (the meeting-bot reaches it via
      # 172.19.0.1) — NEVER 0.0.0.0: the port was internet-open with no auth and being
      # probed by scanners (found live Aug 5).
      - "127.0.0.1:8000:8000"
      - "172.19.0.1:8000:8000"
    volumes:
      # Persistent HF model cache — a container recreate must not re-download ~1.6GB.
      - /root/whisper-cache:/root/.cache/huggingface
    # Cap below host RAM so a pathological file OOMs THIS container (docker restarts it)
    # instead of letting the kernel pick a victim host-wide.
    mem_limit: 5g
    restart: unless-stopped

  meeting-bot:
    build:
      context: ../meeting-bot
      dockerfile: Dockerfile
    environment:
      BOT_SECRET: ${MEETING_BOT_SECRET}
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUGMTD_WEBHOOK_BASE_URL: https://app.augmtd.ai
      MAX_CONCURRENT_BOTS: "4"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      PROXY_URL: ${PROXY_URL}
    ports:
      - "3001:3001"
    shm_size: "2gb"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - bot-scheduler:/data
      - /root/augmtd-infra/google-auth.json:/app/google-auth.json:ro
    restart: unless-stopped

volumes:
  bot-scheduler:
